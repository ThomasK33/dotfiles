
[window]
decorations = "buttonless"
# opacity = 0.8
# blur = true

option_as_alt = "OnlyRight"

padding.x = 4
padding.y = 4

[env]
TERM = "xterm-256color"

[font]
size = 12.5

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

# Skip word left
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001bb"

# Skip word right
[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001bf"

# Home
[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001bOH"
# mode = "AppCursor"

# End
[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001bOF"
# mode = "AppCursor"

# Delete line
[[keyboard.bindings]]
key = "Back"
mods = "Command"
chars = "\u0015"

# Delete word
[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u001b\u007f"

[general]
import = ["~/.config/alacritty/themes/themes/kanagawa_wave.toml"]

