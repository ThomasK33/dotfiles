packages:
  # Cross-platform brews (installed wherever brew is on PATH).
  brews:
    - bash
    - curl
    - git
    - lld
    - llvm
    - mcfly         # Needs to be managed by Brew, as maintainers don't have arm64 macos binaries on the releases
    - moreutils
    - pv
    - tmux-mem-cpu-load
    - wget
    - ttyd
  darwin:
    brews:
      - gnu-getopt    # Linux has util-linux's getopt by default
      - tailscale     # on Linux, install via the official package
    casks:
      - alfred
      - dbeaver-community
      - font-fira-code-nerd-font
      - rectangle-pro
      - steipete/tap/codexbar
  linux:
    brews: []
