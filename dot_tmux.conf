set -g mouse on

# set -g default-terminal "alacritty"
# # set -as terminal-overrides ",alacritty:RGB"
# set-option -sa terminal-overrides ",xterm*:Tc"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set-option -g focus-events on

unbind C-b
set-option -g prefix C-a

# bind-key -n Home send-key C-a
# bind-key -n End send-key C-e

bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

set -sg escape-time 0

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Set new panes to open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind-key -r M-b resize-pane -L 5
bind-key -r M-f resize-pane -R 5

# Styling
set -g status-interval 1
set -g status-justify centre # center align window list  NOTE:: don't change to "center"
# Status left
set -g status-left-length 50
set -g status-left '#[fg=white,dim,bold]#S #[default]'
# Status right
set -g status-right-length 140
set -g status-right '#{prefix_highlight} #[fg=green,bg=default,bright]#(tmux-mem-cpu-load --averages-count=2 --mem-mode=0) #[fg=white,dim,bold]| #[fg=white,bg=default]%H:%M:%S#[default] #[fg=blue]%d.%m.%Y'

# Kanagawa colors, see: https://github.com/rebelot/kanagawa.nvim
set-option -g status-style bg="#1F1F28",fg="#C8C093",default
# default window title colors
set-window-option -g window-status-style fg="#C8C093",bg=default,dim 
# active window title colors
set-window-option -g window-status-current-style fg="#7FB4CA",bg=default,bright 
# pane border
set-option -g pane-border-style fg="#16161D"
set-option -g pane-active-border-style fg="#363646"
# message text
set-option -g message-style bg="#C8C093",fg="#1F1F28"
# pane number display
set-option -g display-panes-active-colour "#7FB4CA"
set-option -g display-panes-colour "#ffa066"
# clock
set-window-option -g clock-mode-colour "#7FB4CA"

set -g base-index 1

# setw -g monitor-activity on
# set -g visual-activity off

# --- TPM ---
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
